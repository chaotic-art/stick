manifestVersion: subsquid.io/v0.1
name: speck
version: 17
description: 'SubSquid indexer for Uniques and Assets on Statemint'
build: 
deploy:
  processor:
    cmd:
      - node
      - lib/processor
    env:
      CHAIN: polkadot
      OFFER: 174
      UNIQUES_ENABLED: true
      RARITY_BACKFILL_ENABLED: true
      NFT_ATTRIBUTE_BACKFILL_ENABLED: true
      DB_URL: "${{ secrets.POLKADOT }}"
  api:
    cmd:
      - npx
      - squid-graphql-server
      - '--subscriptions'
      - '--dumb-cache'
      - in-memory
      - '--dumb-cache-ttl'
      - '1000'
      - '--dumb-cache-size'
      - '100'
      - '--dumb-cache-max-age'
      - '1000'
    env:
      DB_URL: "${{ secrets.POLKADOT }}"
